name: LinuxOnPad
options:
  bundleIdPrefix: "dev.pkdev"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LinuxOnPad:
    type: application
    platform: iOS
    sources:
      - App
      - Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "dev.pkdev.linuxonpad"
        PRODUCT_NAME: "LinuxOnPad"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/App/LinuxOnPad-Bridging-Header.h"
