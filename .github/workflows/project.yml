name: LinuxOnPad
options:
  bundleIdPrefix: dev.pkdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  LinuxOnPad:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pkdev.linuxonpad
        PRODUCT_NAME: LinuxOnPad
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        SWIFT_OBJC_BRIDGING_HEADER: App/LinuxOnPad-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
